name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  analytics:
    name: Analytics tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [server, client, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t amigo-server ./server
          docker build -t amigo-client ./client
          docker build -t amigo-analytics ./analytics-service
      - name: Validate compose configuration
        env:
          MONGO_ROOT_PASSWORD: ci-compose-password
          JWT_SECRET: ci-compose-secret-with-at-least-32-characters
        run: docker compose config --quiet
