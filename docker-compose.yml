name: amigo

services:
  mongodb:
    image: mongo:7
    container_name: amigo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-amigo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  analytics-service:
    build:
      context: ./analytics-service
    container_name: amigo-analytics
    restart: unless-stopped
    environment:
      SERVICE_NAME: AmiGo Analytics Service
      SERVICE_PORT: 8000
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8000}:8000"

  server:
    build:
      context: ./server
    container_name: amigo-server
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-amigo}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/amigo?authSource=admin
      MONGO_CONNECT_TIMEOUT_MS: 10000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      ANALYTICS_TIMEOUT_MS: 3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "127.0.0.1:${SERVER_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      analytics-service:
        condition: service_started

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    container_name: amigo-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
